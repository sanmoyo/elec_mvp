name: Scrape TEC Register

"on":
  schedule:
    # Runs daily at 06:00 UTC. NESO updates twice weekly (Tue/Fri), so
    # this comfortably catches every real update without hammering them.
    - cron: '0 6 * * *'
  workflow_dispatch: {}  # lets you trigger it manually from the GitHub Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed so the workflow can push commits back
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch latest TEC register
        run: python fetch_tec_register.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tec_register.csv
          git diff --staged --quiet || git commit -m "Update TEC register snapshot $(date -u +%Y-%m-%d)"
          git push