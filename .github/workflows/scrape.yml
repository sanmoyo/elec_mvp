name: Scrape TEC Register

on:
  schedule:
    # Runs daily at 06:00 UTC. NESO updates twice weekly (Tue/Fri), so
    # this comfortably catches every real update without hammering them.
    - cron: '0 6 * * *'
  workflow_dispatch: {}  # lets you trigger it manually from the GitHub Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed so the workflow can push commits back
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history, so `git show HEAD~1:...` works later

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests csv-diff

      - name: Fetch latest TEC register
        run: python fetch_tec_register.py

      - name: Commit data if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tec_register.csv
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update TEC register snapshot $(date -u +%Y-%m-%d)"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarise changes
        if: steps.commit.outputs.changed == 'true'
        run: python summarise_changes.py --git

      - name: Run B13 report
        if: steps.commit.outputs.changed == 'true'
        run: python b13_report.py

      - name: Commit summary and B13 reports
        if: steps.commit.outputs.changed == 'true'
        run: |
          git add changes/ b13_reports/ data/b13_queue.csv
          git commit -m "Add change summary and B13 report $(date -u +%Y-%m-%d)"

      - name: Push
        if: steps.commit.outputs.changed == 'true'
        run: git push